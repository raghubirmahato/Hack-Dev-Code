- insert:
    - id: cua-provider-registry
      name: '@hackdevcode/dsh-computer-use'
    - id: cua
      name: '@hackdevcode/dsh-experimental-cua-macos'
      disabled: !!js process.platform !== 'darwin'
      config:
        agentPreset: ptc
    - id: cua-driver
      name: '@hackdevcode/dsh-experimental-computer-use-cua-driver-native'
      disabled: !!js process.platform === 'darwin'
    - id: ui-cua
      name: '@hackdevcode/dsh-cua'
    - id: browser-provider-registry
      name: '@hackdevcode/dsh-browser-use'
    - id: chrome
      name: '@hackdevcode/dsh-experimental-browser-use-chrome-devtools-mcp'
      config:
        mode: launch
        headless: false
        isolated: false
        vision: true
        screenshotMaxWidth: 1280
