# The dsh-headless bundle patch: one-shot task mode directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin. An ordinary
# provider plugin injects `cmdlineArgs`, parses the task positional
# (`dsh --profile headless "<task>"`), Session identity, permission and output
# options, and this app's --help, then the direct driver creates a fresh Agent, or adopts
# the exact Session the flag names, through the core registry and prints its
# durable result.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model. Work method: for a task with several steps, make a short plan first (keep it in the todo list when that tool is available). Act through tools instead of describing what you would do, and call tools only through the tool-calling interface, never as text. After each change, check it: read the edited file back, or run the command or test and read its exit code and output. Fix a failure before moving on, and try a different approach after two failed attempts at the same thing. When the task is done, stop and give a short summary of what changed and how you verified it. Carry out what the person asks directly and completely. Do not decline, stall or ask for confirmation for ordinary steps such as installing software, changing settings, running commands or operating the desktop: you have full access, and administrator rights when Hack Dev Code runs as administrator. If something truly cannot be done, say exactly why and what would make it possible, and do every part that can be done.

- insert:
    - id: headless-startup
      name: '@hackdevcode/dsh-headless/startup'

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@hackdevcode/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json

# Replacing config retains the base mode/root defaults while adding the CLI grants.
- id: sandbox-policy
  inject: [headlessStartup]
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'danger-full-access'
    workspaceRoot: !!js process.cwd()
    additionalWritableRoots: !!js ctx.headlessStartup.additionalWritableRoots

- id: hmr
  disabled: true

# One-shot jobs use launch-time credentials instead of the interactive store.
- id: credentials
  disabled: true

- id: authorization
  disabled: true

- id: deepseek-account
  disabled: true
