[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hack-dev-code-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled dsh CLI runtime for the Hack Dev Code Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/hack-dev-code/hack-dev-code"
Documentation = "https://github.com/hack-dev-code/hack-dev-code/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/hack-dev-code/hack-dev-code/issues"
Source = "https://github.com/hack-dev-code/hack-dev-code"

[project.scripts]
dsh = "hack_dev_code_runtime:main"

# Include the injected dsh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/hack_dev_code_runtime/runtime/hack-dev-code-sdk-runtime-*",
  "src/hack_dev_code_runtime/runtime/hack-dev-code-sdk-runtime-*/**",
  "src/hack_dev_code_runtime/runtime/linux-*/**",
  "src/hack_dev_code_runtime/runtime/macos-*/**",
  "src/hack_dev_code_runtime/runtime/win-*/**",
]
exclude = ["src/hack_dev_code_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/hack_dev_code_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
