# Keyless TypeScript SDK replay patch over the live profile patch.

- id: llm-deepseek
  name: '@hackdevcode/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@hackdevcode/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

- id: session-log-deepseek
  name: '@hackdevcode/dsh-session-log-deepseek'
  config:
    enabled: true
